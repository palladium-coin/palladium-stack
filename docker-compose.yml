networks:
  palladium:
    name: palladium  # fixed name, independent of the directory — other stacks can join with external: true

services:
  palladiumd:
    build:
      context: .
      dockerfile: Dockerfile.palladium-node
    image: palladium-node:local
    container_name: palladium-node
    restart: unless-stopped
    networks:
      - palladium
    ports:
      - "0.0.0.0:2333:2333"  # P2P port mainnet (accessible from network)
      # For testnet, expose: 12333 (P2P)
      # RPC (2332) and ZMQ (28332/28334/28335) are NOT exposed on the host.
      # Other Docker stacks on this host can reach them via palladium-net:
      #   palladiumd:2332  (RPC)
      #   palladiumd:28332 (ZMQ hashblock)
      #   palladiumd:28334 (ZMQ rawblock)
      #   palladiumd:28335 (ZMQ rawtx)

    volumes:
      # Mount .palladium folder (contains config and blockchain data)
      - ./.palladium:/root/.palladium

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "palladium-cli", "-conf=/root/.palladium/palladium.conf", "-datadir=/root/.palladium", "getblockchaininfo"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s  # loading the block index can take minutes on large chains

    command: >
      palladiumd
      -conf=/root/.palladium/palladium.conf
      -datadir=/root/.palladium
      -daemon=0
      -printtoconsole=1

  electrumx:
    build:
      context: .
      dockerfile: Dockerfile.electrumx
    image: plm-electrumx:local
    container_name: plm-electrumx
    restart: unless-stopped
    depends_on:
      palladiumd:
        condition: service_healthy
    networks:
      - palladium
    ports:
      - "0.0.0.0:${ELECTRUMX_TCP_PORT:-50001}:${ELECTRUMX_TCP_PORT:-50001}"  # TCP
      - "0.0.0.0:${ELECTRUMX_SSL_PORT:-50002}:${ELECTRUMX_SSL_PORT:-50002}"  # SSL

    healthcheck:
      # Client ports (50001/50002) only open after the first full sync;
      # the RPC listener (8000) is up from startup, so probe that instead.
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 5).close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    environment:
      # ===== Network Configuration =====
      # For MAINNET use: COIN: "Palladium", NET: "mainnet"
      # For TESTNET use: COIN: "Palladium", NET: "testnet"

      COIN: "Palladium"  # Always "Palladium" for both networks
      NET: "mainnet"

      # NOTE: RPC credentials are automatically read from palladium.conf
      # No need to configure DAEMON_URL manually anymore!

      SERVICES: "tcp://0.0.0.0:${ELECTRUMX_TCP_PORT:-50001},ssl://0.0.0.0:${ELECTRUMX_SSL_PORT:-50002},rpc://0.0.0.0:8000"

      # Ports also exported for entrypoint.sh (REPORT_SERVICES auto-detection)
      ELECTRUMX_TCP_PORT: "${ELECTRUMX_TCP_PORT:-50001}"
      ELECTRUMX_SSL_PORT: "${ELECTRUMX_SSL_PORT:-50002}"

      # Extra seed peers for bootstrap (comma-separated, ElectrumX format).
      # A new server only needs ONE reachable existing peer here: discovery
      # then propagates all the others automatically.
      EXTRA_PEERS: "${ELECTRUMX_EXTRA_PEERS:-}"

      SSL_CERTFILE: "/certs/server.crt"
      SSL_KEYFILE: "/certs/server.key"

      DB_DIRECTORY: "/data"
      PEER_DISCOVERY: "on"
      PEER_ANNOUNCE: "true"
      # REPORT_SERVICES is auto-detected at startup. Set manually only to override.
      # REPORT_SERVICES: "tcp://your.public.ip:50001,ssl://your.public.ip:50002"
      INITIAL_CONCURRENT: "2"

      # ===== Resource limits (production hardening) =====
      # Per-session DoS protection: throttle at soft limit, disconnect at hard limit.
      # Never set these to 0 on a publicly announced server.
      COST_SOFT_LIMIT: "1000"
      COST_HARD_LIMIT: "10000"
      # In-memory UTXO/history cache before flushing to disk.
      # Real peak usage can reach 2-3x this value during initial sync;
      # tune via .env based on host RAM (800 for 4GB hosts, 1500+ for 8GB).
      CACHE_MB: "${ELECTRUMX_CACHE_MB:-800}"
      MAX_SESSIONS: "1000"
      SESSION_TIMEOUT: "600"

      DONATION_ADDRESS: "plm1qdq3gu2zvg9lyr8gxd6yln4wavc5tlp8prmvfay"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

    volumes:
      - ./electrumx-data:/data
      - ./.palladium/palladium.conf:/palladium-config/palladium.conf:ro
      - ./certs:/certs

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: palladium-dashboard:local
    container_name: palladium-dashboard
    restart: unless-stopped
    depends_on:
      palladiumd:
        condition: service_healthy
      electrumx:
        condition: service_healthy
    networks:
      - palladium
    ports:
      - "0.0.0.0:${DASHBOARD_PORT:-8080}:8080"  # Web Dashboard (accessible from network)

    environment:
      PALLADIUM_RPC_HOST: "palladiumd"
      PALLADIUM_RPC_PORT: "2332"
      ELECTRUMX_RPC_HOST: "electrumx"
      ELECTRUMX_RPC_PORT: "8000"
      DASHBOARD_AUTH_USERNAME: "${DASHBOARD_AUTH_USERNAME:-admin}"
      DASHBOARD_AUTH_PASSWORD: "${DASHBOARD_AUTH_PASSWORD:-change-me-now}"
      API_KEY: "${API_KEY:-}"
      DASHBOARD_SESSION_HOURS: "${DASHBOARD_SESSION_HOURS:-1}"
      DASHBOARD_SESSION_COOKIE_SECURE: "${DASHBOARD_SESSION_COOKIE_SECURE:-false}"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      - ./.palladium/palladium.conf:/palladium-config/palladium.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
